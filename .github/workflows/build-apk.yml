name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -q AffiliateCam-Android.zip -d project

      - name: Generate Wrapper & Build APK
        run: |
          cd project/AffiliateCam-Android
          # Pasang gradle wrapper versi 8.2 secara lokal di runner
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateCam-APK
          path: project/AffiliateCam-Android/app/build/outputs/apk/debug/*.apk
          
