name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and inspect
        run: |
          mkdir project
          unzip -q AffiliateCam-Android.zip -d project
          echo "=== DAFTAR SEMUA FILE DALAM ZIP ==="
          find project -maxdepth 3
