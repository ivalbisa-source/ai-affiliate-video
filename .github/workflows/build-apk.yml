name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -q AffiliateCam-Android.zip -d project

      - name: Build APK with Gradle
        run: |
          cd project/AffiliateCam-Android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AffiliateCam-APK
          path: project/AffiliateCam-Android/app/build/outputs/apk/debug/*.apk
          
